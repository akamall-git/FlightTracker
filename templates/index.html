<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="Viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Tracker</title>

    <!-- CSS Style Sheet-->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style/main.css') }}"
    />

    <!-- Leaflet -->
    <link
        rel = "stylesheet"
        href = "https://unpkg.com/leaflet/dist/leaflet.css"
    />
    <script src = "https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        body.image-bk {
            background-image:
                url("{{ url_for('static', filename='images/wallpaper.jpg') }}");
                background-size: cover;
                background-position: center;
        }

        .content {
            max-width: 1000px;
            margin: 4rem auto;
            text-align: center;
        }

        .button {
            width: 120px;
            margin-top: 2rem;
        }

        .split {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }
        .split > .left,
        .split > .right {
            flex: 1;
        }

        /* Placeholder for the map, an empty box with grey dashed border lines*/
        .map-placeholder {
            border: 3px dashed rgba(0, 0, 0, 0.5);
            min-height: 200px;
            padding: 1rem;
            margin: 1rem;
        }

        

        /* inline-radio buttons */
        .radio-group {
            display: flex;
            width: 100%;
            justify-content: space-evenly;
            align-items: center;
            margin-top: 1rem;

            /* gap: 1.5rem; */
        }

        .radio-group label {
            flex: 1;
            text-align: center;

            /* font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; */
            /* font-size: 1rem; */
            /* color: white; */
        }

        /* Leaflet container for the map */
        #map {
            height: 300px;
            margin: 1rem;
            border: 3px dashed rgba(0, 0, 0, 0.5);
        }

        /* Override .forms-inside so it sits in proper location */
        .forms-inside {
            /* Overides inhertited styling to ensure proper placement */
            transform: none !important;

            /* Centers the form box */
            width: 80% !important;
            margin: 1.5rem auto !important;

            /* Maintains border styling */
            border: 1px solid rgb(107, 107, 107);
            border-radius: 4px;

            /* background-color: white; */
        }
        
        /* Increases height of text input box for ease of use */
        .input {
            height: 1rem !important;
            line-height: 1rem;
        }

    </style>
</head>
<body class="image-bk">
    <div class="content">
        <div class="content-inside">

            <!-- Full window width title -->
            <h1 class="title-vista-blue">Flight Tracker</h1>
            
            <!-- Splits page into 2 equal columns -->
            <div class="split">

                <!-- Left side column, placeholder for map --> 
                <div class="left">
                    <h2 class="subtitle-vista-blue">Map</h2>
                    <hr class="spacing">
                    <p class="text">Map</p>
                    <div id="map"></div>
                </div>

                <!-- Right side column -->
                <div class="right">
                    <h2 class="subtitle-vista-blue">Settings</h2>
                    <hr class="spacing">
                    <p class="text">Adjust settings</p>

                    
                    <div class="forms-inside">

                        <!-- paragraph text to explain to user what an ICAO code is -->
                        <p class="text">ICAO code: unique four-letter airport identifier</p>

                        <!-- Text input for ICAO code -->
                        <input
                        type="text"
                        id="ICAOInput"
                        class="input"
                        placeholder="Enter ICAO code"
                        maxlength="4"
                        />

                        <!-- Three inline radio buttons -->
                        <div class="radio-group">
                            <!-- Departures -->
                            <label class="text">
                                <input type="radio" name="flightType" value="arrivals" />
                                Arrivals
                            </label>
    
                            <!-- Arrivals -->
                            <label class="text">
                                <input type="radio" name="flightType" value="departures" />
                                Departures
                            </label>
    

                            <!-- Both. Not used anymore -->
                            <!-- <label class="text">
                                <input type="radio" name="flightType" value="both" />
                                Both
                            </label> -->


                        </div> <!-- end of radio-group -->
                        <button id ="goButton" class="button">Go</button> <!-- Le go button -->
                    </div> <!-- end of forms.inside -->   
                </div>  <!-- end of right side column -->
            </div> <!-- end of split -->
        </div> <!-- end of content-inside -->
    </div> <!-- end of content -->

    <script> 
        // Init map
        const map = L.map("map").setView([20,0], 2); // Set init view on map
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);
        let marker; // Declare marker var.

        document.getElementById("goButton").addEventListener("click", async () => {
            const code = document.getElementById("ICAOInput").value.trim().toUpperCase();
            const type = document.querySelector('input[name="flightType"]:checked');
            if (!code || !type) {
                return alert("Please enter an ICAO code and select a flight type.");
            }

            //fetch airport data
            const res = await fetch("/api/airports");
            const data = await res.json();

            if (!data [code]) {
                return alert("Invalid ICAO code, airport not found.");
            }

            const {lat, lon, name } = data[code]; 
            
            
            //remove old marker if it exists
            if (marker) {
                map.removeLayer(marker);
            }
            //create new marker
            marker = L.marker([lat, lon])
                .addTo(map)
                .bindPopup(`<b>${name}</b><br>ICAO: ${code}`) 
                .openPopup();
            map.setView([lat, lon], 8);
        });

        // Redundant as hell code
        /* // Test button
        document.getElementById("testButton").addEventListener("click", () => {
            alert("Test button pressed!");
        } )  */
    </script> 

</body>
</html>
